name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-tests:
    name: Python 3.14 · synthetic fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-demo.lock
      - name: Install demo and test dependencies
        run: python -m pip install -c requirements-demo.lock -e '.[dev]'
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run tests without credentials or historical databases
        run: python -m unittest discover -s tests -v
      - name: Run offline demonstrations
        run: |
          python -m quote_agent.demo
          python -m quote_agent.demo --scenario shortage
          python -m quote_agent.demo --scenario malformed-model
