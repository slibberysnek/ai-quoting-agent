[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wwi-sqlite"
version = "1.0.0"
description = "AI-assisted RFQ proposals with deterministic business rules and WWI sample data tools"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.115,<1",
    "openpyxl>=3.1",
    "pydantic>=2.0",
    "pypdf>=6.0",
    "python-docx>=1.1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
cloud = ["mssql-python>=1.0,<2"]
fixtures = ["reportlab>=4,<5"]
dev = [
    "httpx>=0.27,<1",
]

[project.scripts]
wwi-sqlite = "wwi_sqlite.__main__:main"
quote-agent = "quote_agent.__main__:main"
quote-agent-web = "quote_agent.web:run"
quote-agent-subscribe = "quote_agent.subscribe:main"

[tool.setuptools]
packages = ["wwi_sqlite", "quote_agent"]

[tool.setuptools.package-data]
quote_agent = ["reference_data/*.csv", "demo_data/*.json", "demo_data/*.eml", "demo_data/reference/*.csv"]
